name: Release

# A v* tag runs the tests, builds the zip with the BigWigs packager and
# uploads it to the GitHub release.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the tests
        run: |
          sudo apt-get install -y -qq lua5.1 > /dev/null
          luac5.1 -p ForeverCDMAdvanced.lua
          luac5.1 -p ForeverCDMAdvanced_UI.lua
          lua5.1 tests/test_dynamic.lua

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
